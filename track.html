<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Track Your Repair | Shree Sawriya Solutions</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="track.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="Shree Sawriya Solutions">
      <span>SHREE SAWRIYA SOLUTIONS</span>
    </a>
    <div class="nav-right">
      <a href="index.html" class="back" data-i18n="back">&larr; Home</a>
      <div class="lang">
        <button type="button" class="lb active" data-lang="en">EN</button>
        <button type="button" class="lb" data-lang="hi">हिं</button>
        <button type="button" class="lb" data-lang="pa">ਪੰ</button>
      </div>
    </div>
  </nav>

  <header class="hero">
    <span class="tag" data-i18n="tag">REPAIR STATUS</span>
    <h1 data-i18n="h1">Check Your Phone Status</h1>
    <p data-i18n="sub">Enter your registered mobile number. All your phones will show together.</p>
  </header>

  <main class="wrap">
    <div class="box">
      <form id="trackForm" novalidate>
        <label for="mobile" data-i18n="label">Mobile Number</label>
        <div class="row">
          <input id="mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" data-i18n-ph="ph" placeholder="10-digit mobile number">
          <button type="submit" id="goBtn" data-i18n="btn">Check Status</button>
        </div>
      </form>
      <div class="note" data-i18n="note">Only the mobile number given at the shop will work.</div>
    </div>

    <div id="result"></div>
  </main>

  <div class="float">
    <a href="https://wa.me/919720076900" class="fb wa" aria-label="WhatsApp">WA</a>
    <a href="tel:+919720076900" class="fb call" aria-label="Call">Call</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="track.js"></script>
<script src="visits.js" defer></script>
</body>
</html>

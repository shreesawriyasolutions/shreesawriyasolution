<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Sale Register | Shree Sawriya Solutions</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
a { text-decoration: none; color: inherit; }

.navbar { position: sticky; top: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #222; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-wrap: wrap; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; color: #fff; }
.logo img { width: 34px; height: 34px; object-fit: contain; }
.back-btn { color: #aaa; font-size: 13px; }

.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

.page-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; text-align: center; }
.page-sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }

/* SUMMARY CARDS */
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 25px; }
.summary-card { background: linear-gradient(145deg, #151515, #0d0d0d); border: 1px solid #2a2a2a; border-radius: 16px; padding: 18px; text-align: center; }
.summary-card .label { font-size: 10px; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.summary-card .value { font-size: 22px; font-weight: 800; }
.summary-card.income .value { color: #4ade80; }
.summary-card.expense .value { color: #ff6666; }
.summary-card.savings .value { color: #ffb800; }
.summary-card.total .value { color: #fff; }

/* FORM */
.form-box { background: linear-gradient(145deg, #151515, #0d0d0d); border: 1px solid #2a2a2a; border-radius: 20px; padding: 25px; margin-bottom: 25px; }
.form-box h3 { color: #fff; font-size: 18px; margin-bottom: 20px; font-weight: 700; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
@media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
.form-grid input, .form-grid select, .form-grid textarea {
  padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 13px; outline: none; font-family: inherit;
}
.form-grid textarea { grid-column: 1 / -1; min-height: 60px; resize: vertical; }
.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus { border-color: #4ade80; }

.btn { padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; font-family: inherit; }
.btn-primary { background: linear-gradient(90deg, #4ade80, #22c55e); color: #000; }
.btn-cancel { background: #333; color: #fff; margin-left: 10px; }
.btn-small { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

/* SEARCH */
.search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.search-box input { flex: 1; min-width: 200px; padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 14px; outline: none; }
.search-box button { padding: 12px 20px; border-radius: 10px; background: #1a1a1a; color: #fff; border: 1px solid #333; font-weight: 600; cursor: pointer; font-family: inherit; }

/* SALE LIST */
.sale-list { display: grid; gap: 12px; }
.sale-card { background: linear-gradient(145deg, #151515, #0d0d0d); border: 1px solid #2a2a2a; border-radius: 16px; padding: 18px; position: relative; }
.sale-card .date-badge { display: inline-block; background: #1a1a1a; border: 1px solid #333; padding: 3px 10px; border-radius: 50px; font-size: 11px; color: #aaa; margin-bottom: 8px; }
.sale-card h4 { color: #fff; font-size: 16px; margin-bottom: 10px; font-weight: 700; }
.sale-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
.sale-row .lbl { color: #888; }
.sale-row .val { color: #fff; font-weight: 600; }
.sale-row .val.green { color: #4ade80; }
.sale-row .val.red { color: #ff6666; }
.sale-row .val.gold { color: #ffb800; font-weight: 700; }
.card-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn-edit { background: #1a1a1a; color: #fff; border: 1px solid #333; }
.btn-delete { background: #2a1a1a; color: #ff6666; border: 1px solid #553333; }

.loading { text-align: center; padding: 40px; color: #888; }
.empty { text-align: center; padding: 40px; color: #666; }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #000; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 9999; }
#toast.show { opacity: 1; }
#toast.error { background: #ff4444; color: #fff; }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">
    <img src="logo.png" alt="Shree Sawriya">
    <span>DAILY SALE REGISTER</span>
  </a>
  <a href="index.html" class="back-btn">← Home</a>
</nav>

<div class="container">
  <h1 class="page-title">Daily Sale Register</h1>
  <p class="page-sub">Track your daily income, expense, and savings</p>

  <!-- SUMMARY -->
  <div class="summary-grid">
    <div class="summary-card income">
      <div class="label">Today Received</div>
      <div class="value" id="todayIncome">₹0</div>
    </div>
    <div class="summary-card expense">
      <div class="label">Today Expense</div>
      <div class="value" id="todayExpense">₹0</div>
    </div>
    <div class="summary-card savings">
      <div class="label">Today Savings</div>
      <div class="value" id="todaySavings">₹0</div>
    </div>
    <div class="summary-card total">
      <div class="label">Total Entries</div>
      <div class="value" id="totalEntries">0</div>
    </div>
  </div>

  <!-- ADD/EDIT FORM -->
  <div class="form-box">
    <h3 id="formTitle">➕ Add New Entry</h3>
    <div class="form-grid">
      <input type="text" id="customerName" placeholder="Customer Name (optional)">
      <input type="text" id="work" placeholder="Kaam / Sale *" required>
      <input type="number" id="amountReceived" placeholder="Kitne Pese Liye (₹) *" required>
      <input type="number" id="expense" placeholder="Kharcha (₹)">
      <select id="paymentMode">
        <option value="">Payment Mode</option>
        <option value="Cash">Cash</option>
        <option value="UPI">UPI</option>
        <option value="Card">Card</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="entryBy" placeholder="Your Name *" required>
      <textarea id="notes" placeholder="Notes (optional)"></textarea>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">Add Entry</button>
    <button class="btn btn-cancel" id="cancelBtn" onclick="cancelEdit()" style="display:none;">Cancel</button>
  </div>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by customer or work..." oninput="filterSales()">
    <button onclick="showAllSales()">Show All</button>
  </div>

  <!-- SALE LIST -->
  <div id="saleList">
    <div class="loading">Loading sales...</div>
  </div>
</div>

<div id="toast"></div>

<script>
// ========== LOGIN PROTECTION ==========
(function() {
  var PASSWORD = "shree@2025#Stock";
  var attempts = 0;
  var maxAttempts = 5;
  
  var isLoggedIn = sessionStorage.getItem('sale_logged_in');
  
  if (isLoggedIn !== 'yes') {
    var userPassword = prompt("🔐 Daily Sale Register\n\nPlease enter the password:");
    
    while (userPassword !== PASSWORD && attempts < maxAttempts) {
      attempts++;
      if (attempts >= maxAttempts) {
        document.body.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#0a0a0a; color:#fff; font-family:sans-serif; text-align:center; padding:20px;"><div><h2 style="color:#ff4444;">🔒 Access Locked</h2><p style="color:#888; margin-top:10px;">Too many wrong attempts. Please refresh the page and try again later.</p></div></div>';
        return;
      }
      userPassword = prompt("❌ Wrong password! Attempts left: " + (maxAttempts - attempts) + "\n\nPlease try again:");
    }
    
    if (userPassword === PASSWORD) {
      sessionStorage.setItem('sale_logged_in', 'yes');
    } else {
      document.body.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#0a0a0a; color:#fff; font-family:sans-serif;"><h2 style="color:#ff4444;">🔒 Access Denied</h2></div>';
      return;
    }
  }
})();

// ========== SALE MANAGEMENT ==========
var API_URL = "https://script.google.com/macros/s/AKfycbyjSgL3dFagvi0B2JN82tLYveeL4L2sRXXIaCxh5RwkcEYi9d78r_bi0XUQRf-JGibIDg/exec";
var SECRET_KEY = "sawriya_sale_2025_secure";

var allSales = [];
var editingRow = null;

function toast(msg, isError) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isError ? 'show error' : 'show';
  setTimeout(function() { el.className = ''; }, 3000);
}

function loadSales() {
  fetch(API_URL + "?action=getAll&key=" + SECRET_KEY)
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (data.success) {
        allSales = data.sales;
        renderSales(allSales);
        updateSummary();
      } else {
        document.getElementById('saleList').innerHTML = '<div class="empty">Error loading sales</div>';
      }
    })
    .catch(function(error) {
      document.getElementById('saleList').innerHTML = '<div class="empty">Failed to connect</div>';
      console.log(error);
    });
}

function updateSummary() {
  var today = new Date();
  var todayDay = ('0' + today.getDate()).slice(-2);
  var todayMonth = ('0' + (today.getMonth() + 1)).slice(-2);
  var todayYear = today.getFullYear();
  var todayStr = todayDay + '/' + todayMonth + '/' + todayYear;
  
  var todayIncome = 0;
  var todayExpense = 0;
  var totalIncome = 0;
  var totalExpense = 0;
  
  allSales.forEach(function(sale) {
    var amount = parseFloat(sale.amountReceived) || 0;
    var expense = parseFloat(sale.expense) || 0;
    
    totalIncome += amount;
    totalExpense += expense;
    
    var saleDate = "";
    if (sale.date instanceof Date) {
      saleDate = ('0' + sale.date.getDate()).slice(-2) + '/' + ('0' + (sale.date.getMonth() + 1)).slice(-2) + '/' + sale.date.getFullYear();
    } else {
      saleDate = (sale.date || "").toString().trim();
    }
    
    if (saleDate === todayStr) {
      todayIncome += amount;
      todayExpense += expense;
    }
  });
  
  document.getElementById('todayIncome').textContent = '₹' + todayIncome;
  document.getElementById('todayExpense').textContent = '₹' + todayExpense;
  document.getElementById('todaySavings').textContent = '₹' + (todayIncome - todayExpense);
  document.getElementById('totalEntries').textContent = allSales.length;
}
function renderSales(sales) {
  var container = document.getElementById('saleList');
  if (!sales || sales.length === 0) {
    container.innerHTML = '<div class="empty">No entries yet. Add your first entry above.</div>';
    return;
  }
  var html = '<div class="sale-list">';
  sales.slice().reverse().forEach(function(sale) {
    var amount = parseFloat(sale.amountReceived) || 0;
    var expense = parseFloat(sale.expense) || 0;
    var savings = amount - expense;
    html += '<div class="sale-card">';
    html += '<span class="date-badge">📅 ' + (sale.date || 'No date') + '</span>';
    html += '<h4>' + (sale.work || 'No work') + '</h4>';
    if (sale.customerName) {
      html += '<div class="sale-row"><span class="lbl">Customer</span><span class="val">' + sale.customerName + '</span></div>';
    }
    html += '<div class="sale-row"><span class="lbl">Received</span><span class="val green">₹' + amount + '</span></div>';
    html += '<div class="sale-row"><span class="lbl">Expense</span><span class="val red">₹' + expense + '</span></div>';
    html += '<div class="sale-row"><span class="lbl">Savings</span><span class="val gold">₹' + savings + '</span></div>';
    if (sale.paymentMode) {
      html += '<div class="sale-row"><span class="lbl">Payment</span><span class="val">' + sale.paymentMode + '</span></div>';
    }
    if (sale.notes) {
      html += '<div class="sale-row"><span class="lbl">Notes</span><span class="val">' + sale.notes + '</span></div>';
    }
    html += '<div class="sale-row"><span class="lbl">Entry By</span><span class="val">' + (sale.entryBy || '-') + '</span></div>';
    html += '<div class="card-actions">';
    html += '<button class="btn btn-small btn-edit" onclick="editSale(' + sale.row + ')">✏️ Edit</button>';
    html += '<button class="btn btn-small btn-delete" onclick="deleteSale(' + sale.row + ')">🗑️ Delete</button>';
    html += '</div></div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function filterSales() {
  var query = document.getElementById('searchInput').value.toLowerCase();
  if (!query) { renderSales(allSales); return; }
  var filtered = allSales.filter(function(sale) {
    return (sale.customerName || '').toLowerCase().indexOf(query) !== -1 ||
           (sale.work || '').toLowerCase().indexOf(query) !== -1 ||
           (sale.notes || '').toLowerCase().indexOf(query) !== -1;
  });
  renderSales(filtered);
}

function showAllSales() {
  document.getElementById('searchInput').value = '';
  renderSales(allSales);
}

function submitForm() {
  var work = document.getElementById('work').value.trim();
  var amountReceived = document.getElementById('amountReceived').value.trim();
  var entryBy = document.getElementById('entryBy').value.trim();
  
  if (!work || !amountReceived || !entryBy) {
    toast('Please fill all required fields (*)', true);
    return;
  }
  
  var params = new URLSearchParams({
    key: SECRET_KEY,
    customerName: document.getElementById('customerName').value.trim(),
    work: work,
    amountReceived: amountReceived,
    expense: document.getElementById('expense').value || 0,
    paymentMode: document.getElementById('paymentMode').value,
    notes: document.getElementById('notes').value.trim(),
    entryBy: entryBy
  });
  
  if (editingRow) {
    params.append('row', editingRow);
    params.append('action', 'update');
  } else {
    params.append('action', 'add');
  }
  
  var url = API_URL + '?' + params.toString();
  
  document.getElementById('submitBtn').textContent = 'Saving...';
  fetch(url)
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (data.success) {
        toast(editingRow ? 'Entry updated!' : 'Entry added! Savings: ₹' + data.savings);
        resetForm();
        loadSales();
      } else {
        toast('Error: ' + (data.error || 'Unknown'), true);
      }
    })
    .catch(function(error) {
      toast('Connection error', true);
    })
    .finally(function() {
      document.getElementById('submitBtn').textContent = editingRow ? 'Update Entry' : 'Add Entry';
    });
}

function editSale(row) {
  var sale = allSales.find(function(s) { return s.row === row; });
  if (!sale) return;
  document.getElementById('customerName').value = sale.customerName || '';
  document.getElementById('work').value = sale.work || '';
  document.getElementById('amountReceived').value = sale.amountReceived || '';
  document.getElementById('expense').value = sale.expense || '';
  document.getElementById('paymentMode').value = sale.paymentMode || '';
  document.getElementById('entryBy').value = sale.entryBy || '';
  document.getElementById('notes').value = sale.notes || '';
  
  editingRow = row;
  document.getElementById('formTitle').textContent = '✏️ Edit Entry (Row ' + row + ')';
  document.getElementById('submitBtn').textContent = 'Update Entry';
  document.getElementById('cancelBtn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  resetForm();
}

function resetForm() {
  ['customerName','work','amountReceived','expense','entryBy','notes'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('paymentMode').value = '';
  editingRow = null;
  document.getElementById('formTitle').textContent = '➕ Add New Entry';
  document.getElementById('submitBtn').textContent = 'Add Entry';
  document.getElementById('cancelBtn').style.display = 'none';
}

function deleteSale(row) {
  if (!confirm('Are you sure you want to delete this entry?')) return;
  fetch(API_URL + "?action=delete&key=" + SECRET_KEY + "&row=" + row)
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (data.success) {
        toast('Entry deleted!');
        loadSales();
      } else {
        toast('Error deleting', true);
      }
    })
    .catch(function(error) {
      toast('Connection error', true);
    });
}

window.addEventListener('DOMContentLoaded', loadSales);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Sale Register | Shree Sawriya Solutions</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
a { text-decoration: none; color: inherit; }

.navbar { position: sticky; top: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #222; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-wrap: wrap; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; color: #fff; }
.logo img { width: 34px; height: 34px; object-fit: contain; }
.back-btn { color: #aaa; font-size: 13px; }
.admin-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 14px; border-radius: 50px; font-size: 12px; font-weight: 600; cursor: pointer; }
.admin-btn.active { background: linear-gradient(90deg, #4ade80, #22c55e); color: #000; border: none; }

.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

.page-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; text-align: center; }
.page-sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }

.mode-badge { text-align: center; margin-bottom: 20px; }
.mode-badge span { display: inline-block; padding: 6px 16px; border-radius: 50px; font-size: 12px; font-weight: 700; }
.mode-team { background: rgba(255,184,0,0.15); color: #ffb800; }
.mode-admin { background: rgba(74,222,128,0.15); color: #4ade80; }

.filter-box { background: linear-gradient(145deg, #151515, #0d0d0d); border: 1px solid #2a2a2a; border-radius: 20px; padding: 20px; margin-bottom: 25px; }
.filter-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
.filter-tab { padding: 8px 18px; border-radius: 50px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #333; background: transparent; color: #aaa; }
.filter-tab.active { background: #fff; color: #000; border: none; }
.filter-fields { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filter-fields input { padding: 10px 14px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 13px; outline: none; }
.filter-fields button { padding: 10px 20px; border-radius: 50px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; background: linear-gradient(90deg, #4ade80, #22c55e); color: #000; }
.filter-fields button.export-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; margin-left: auto; }

.form-box { background: linear-gradient(145deg, #151515, #0d0d0d); border: 1px solid #2a2a2a; border-radius: 20px; padding: 25px; margin-bottom: 25px; }
.form-box h3 { color: #fff; font-size: 18px; margin-bottom: 20px; font-weight: 700; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
@media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
.form-grid input, .form-grid select, .form-grid textarea {
  padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 13px; outline: none; font-family: inherit;
}
.form-grid textarea { grid-column: 1 / -1; min-height: 60px; resize: vertical; }
.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus { border-color: #4ade80; }

.btn { padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; font-family: inherit; }
.btn-primary { background: linear-gradient(90deg, #4ade80, #22c55e); color: #000; }
.btn-cancel { background: #333; color: #fff; margin-left: 10px; }
.btn-small { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

.search-box { display: flex; gap: 10px; margin-bottom: 20px; }
.search-box input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 14px; outline: none; }

.sale-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
.sale-card { background: linear-gradient(145deg, #151515, #0d0d0d); border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; position: relative; }
.sale-card h4 { color: #fff; font-size: 16px; margin-bottom: 6px; font-weight: 700; }
.sale-card .date-badge { display: inline-block; background: #111; border: 1px solid #333; padding: 3px 10px; border-radius: 50px; font-size: 11px; color: #4ade80; margin-bottom: 12px; font-weight: 600; }
.sale-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid #1a1a1a; }
.sale-row:last-child { border-bottom: none; }
.sale-row .lbl { color: #888; }
.sale-row .val { color: #fff; font-weight: 600; }
.val-green { color: #4ade80 !important; }
.val-red { color: #ff6666 !important; }
.val-gold { color: #ffb800 !important; }
.card-actions { display: flex; gap: 8px; margin-top: 15px; }
.btn-edit { background: #1a1a1a; color: #fff; border: 1px solid #333; }
.btn-delete { background: #2a1a1a; color: #ff6666; border: 1px solid #553333; }

.loading { text-align: center; padding: 40px; color: #888; }
.empty { text-align: center; padding: 40px; color: #666; }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #000; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 9999; }
#toast.show { opacity: 1; }
#toast.error { background: #ff4444; color: #fff; }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">
    <img src="logo.png" alt="Shree Sawriya">
    <span>DAILY SALE REGISTER</span>
  </a>
  <button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">⚙️ Admin Login</button>
  <a href="index.html" class="back-btn">← Home</a>
</nav>

<div class="container">
  <h1 class="page-title">Daily Sale Register</h1>
  <p class="page-sub">Add and track your daily sales</p>

  <div class="mode-badge">
    <span id="modeBadge" class="mode-team">👥 TEAM MODE — Add Only</span>
  </div>

  <div class="filter-box">
    <div class="filter-tabs">
      <button class="filter-tab active" id="tabToday" onclick="setFilter('today')">📅 Today</button>
      <button class="filter-tab" id="tabSingle" onclick="setFilter('single')">📆 Single Date</button>
      <button class="filter-tab" id="tabRange" onclick="setFilter('range')">📊 Date Range</button>
      <button class="filter-tab" id="tabAll" onclick="setFilter('all')">🗂️ All Time</button>
    </div>
    <div class="filter-fields" id="filterFields" style="display:none;">
      <input type="date" id="singleDate" style="display:none;">
      <input type="date" id="fromDate" style="display:none;">
      <span id="toLabel" style="display:none; color:#888; font-size:13px;">to</span>
      <input type="date" id="toDate" style="display:none;">
      <button onclick="applyFilter()">Apply</button>
      <button class="export-btn" onclick="exportCSV()">📥 Export CSV</button>
    </div>
  </div>

  <div class="form-box">
    <h3 id="formTitle">➕ Add New Entry</h3>
    <div class="form-grid">
      <input type="text" id="dateInput" placeholder="Date (DD/MM/YYYY)" readonly style="background:#0d0d0d; cursor:not-allowed;">
      <input type="text" id="customerName" placeholder="Customer Name (optional)">
      <input type="text" id="work" placeholder="Kaam / Sale *" required>
      <input type="number" id="received" placeholder="Kitne Pese Liye (₹) *" required>
      <input type="number" id="expense" placeholder="Kharcha (₹) *" required>
      <select id="paymentMode">
        <option value="">Payment Mode</option>
        <option value="Cash">Cash</option>
        <option value="UPI">UPI</option>
        <option value="Card">Card</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="entryBy" placeholder="Your Name *" required>
      <textarea id="notes" placeholder="Notes (optional)"></textarea>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">Add Entry</button>
    <button class="btn btn-cancel" id="cancelBtn" onclick="cancelEdit()" style="display:none;">Cancel</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by customer, work, or notes..." oninput="filterSales()">
  </div>

  <div id="salesList">
    <div class="loading">Loading sales...</div>
  </div>
</div>

<div id="toast"></div>

<script>
// ========== 2-PASSWORD LOGIN SYSTEM ==========
var TEAM_PASSWORD = "Sahil@9896#";
var ADMIN_PASSWORD = "Renu@9896#";
var MAX_ATTEMPTS = 5;
var isAdmin = false;

(function() {
  var mode = sessionStorage.getItem('sale_mode');
  
  if (mode === 'admin') {
    isAdmin = true;
  } else if (mode === 'team') {
    isAdmin = false;
  } else {
    var attempts = 0;
    var enteredPassword = prompt("🔐 Daily Sale Register\n\nPlease enter your password:");
    
    while (enteredPassword !== TEAM_PASSWORD && enteredPassword !== ADMIN_PASSWORD && attempts < MAX_ATTEMPTS) {
      attempts++;
      if (attempts >= MAX_ATTEMPTS) {
        document.body.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#0a0a0a; color:#fff; font-family:sans-serif; text-align:center; padding:20px;"><div><h2 style="color:#ff4444;">🔒 Access Locked</h2><p style="color:#888; margin-top:10px;">Too many wrong attempts. Refresh the page to try again.</p></div></div>';
        return;
      }
      enteredPassword = prompt("❌ Wrong password! Attempts left: " + (MAX_ATTEMPTS - attempts) + "\n\nPlease try again:");
    }
    
    if (enteredPassword === ADMIN_PASSWORD) {
      isAdmin = true;
      sessionStorage.setItem('sale_mode', 'admin');
    } else if (enteredPassword === TEAM_PASSWORD) {
      isAdmin = false;
      sessionStorage.setItem('sale_mode', 'team');
    } else {
      document.body.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#0a0a0a; color:#fff; font-family:sans-serif;"><h2 style="color:#ff4444;">🔒 Access Denied</h2></div>';
      return;
    }
  }
})();

function toggleAdmin() {
  if (isAdmin) {
    if (confirm("Logout from Admin Mode?")) {
      sessionStorage.removeItem('sale_mode');
      location.reload();
    }
  } else {
    var pass = prompt("🔐 Admin Login\n\nEnter Admin Password:");
    if (pass === ADMIN_PASSWORD) {
      isAdmin = true;
      sessionStorage.setItem('sale_mode', 'admin');
      location.reload();
    } else {
      alert("❌ Wrong admin password!");
    }
  }
}

// ========== SALE MANAGEMENT ==========
var API_URL = "https://script.google.com/macros/s/AKfycbxi7oqJCD8rlypjY64y6KE1gVzVCM0eaoq0tkxp89jScd0pWRaRnB_tlOsy_bNhgNC7/exec";
var SECRET_KEY = "sawriya_sale_v2_2025";

var allSales = [];
var filteredSales = [];
var editingRow = null;
var currentFilter = 'today';

function toast(msg, isError) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isError ? 'show error' : 'show';
  setTimeout(function() { el.className = ''; }, 3000);
}

function setTodayDate() {
  var today = new Date();
  var dd = String(today.getDate()).padStart(2, '0');
  var mm = String(today.getMonth() + 1).padStart(2, '0');
  var yyyy = today.getFullYear();
  document.getElementById('dateInput').value = dd + '/' + mm + '/' + yyyy;
  return dd + '/' + mm + '/' + yyyy;
}

function updateUI() {
  var adminBtn = document.getElementById('adminBtn');
  var modeBadge = document.getElementById('modeBadge');
  
  if (isAdmin) {
    adminBtn.textContent = '🚪 Logout Admin';
    adminBtn.classList.add('active');
    modeBadge.textContent = '👑 ADMIN MODE — Full Access';
    modeBadge.className = 'mode-admin';
  } else {
    adminBtn.textContent = '⚙️ Admin Login';
    adminBtn.classList.remove('active');
    modeBadge.textContent = '👥 TEAM MODE — Add Only';
    modeBadge.className = 'mode-team';
  }
}

function setFilter(type) {
  currentFilter = type;
  
  ['tabToday', 'tabSingle', 'tabRange', 'tabAll'].forEach(function(id) {
    document.getElementById(id).classList.remove('active');
  });
  
  var fieldContainer = document.getElementById('filterFields');
  var singleDate = document.getElementById('singleDate');
  var fromDate = document.getElementById('fromDate');
  var toDate = document.getElementById('toDate');
  var toLabel = document.getElementById('toLabel');
  
  if (type === 'today') {
    document.getElementById('tabToday').classList.add('active');
    fieldContainer.style.display = 'none';
    applyFilter();
  } else if (type === 'single') {
    document.getElementById('tabSingle').classList.add('active');
    fieldContainer.style.display = 'flex';
    singleDate.style.display = 'block';
    fromDate.style.display = 'none';
    toDate.style.display = 'none';
    toLabel.style.display = 'none';
    if (!singleDate.value) singleDate.value = new Date().toISOString().split('T')[0];
    applyFilter();
  } else if (type === 'range') {
    document.getElementById('tabRange').classList.add('active');
    fieldContainer.style.display = 'flex';
    singleDate.style.display = 'none';
    fromDate.style.display = 'block';
    toDate.style.display = 'block';
    toLabel.style.display = 'block';
    if (!fromDate.value) {
      var d = new Date();
      d.setDate(d.getDate() - 7);
      fromDate.value = d.toISOString().split('T')[0];
    }
    if (!toDate.value) toDate.value = new Date().toISOString().split('T')[0];
    applyFilter();
  } else if (type === 'all') {
    document.getElementById('tabAll').classList.add('active');
    fieldContainer.style.display = 'flex';
    singleDate.style.display = 'none';
    fromDate.style.display = 'none';
    toDate.style.display = 'none';
    toLabel.style.display = 'none';
    applyFilter();
  }
}

// Parse DD/MM/YYYY → Date object
function parseDate(dateStr) {
  if (!dateStr) return null;
  var str = dateStr.toString().trim();
  
  // Format 1: DD/MM/YYYY (or DD/MM/YYYY HH:mm)
  var firstPart = str.split(' ')[0];
  var parts = firstPart.split('/');
  if (parts.length === 3) {
    return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
  }
  
  // Format 2: JavaScript Date string (Sun May 10 2026 ...)
  var d = new Date(str);
  if (!isNaN(d.getTime())) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  
  return null;
}

// Convert date input (YYYY-MM-DD from HTML) to Date object
function parseInputDate(str) {
  if (!str) return null;
  var parts = str.split('-');
  if (parts.length === 3) {
    return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  }
  return null;
}

// Format Date to DD/MM/YYYY
function formatDate(d) {
  var dd = String(d.getDate()).padStart(2, '0');
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  var yyyy = d.getFullYear();
  return dd + '/' + mm + '/' + yyyy;
}

function applyFilter() {
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  
  var filterStart = null;
  var filterEnd = null;
  var filterLabel = '';
  
  if (currentFilter === 'today') {
    filterStart = new Date(today);
    filterEnd = new Date(today);
    filterEnd.setHours(23, 59, 59, 999);
    filterLabel = 'Today (' + formatDate(today) + ')';
  } else if (currentFilter === 'single') {
    var sd = document.getElementById('singleDate').value;
    if (sd) {
      var sdDate = parseInputDate(sd);
      if (sdDate) {
        filterStart = new Date(sdDate);
        filterStart.setHours(0, 0, 0, 0);
        filterEnd = new Date(sdDate);
        filterEnd.setHours(23, 59, 59, 999);
        filterLabel = 'Date: ' + formatDate(sdDate);
      }
    }
  } else if (currentFilter === 'range') {
    var fd = document.getElementById('fromDate').value;
    var td = document.getElementById('toDate').value;
    if (fd && td) {
      var fdDate = parseInputDate(fd);
      var tdDate = parseInputDate(td);
      if (fdDate && tdDate) {
        filterStart = new Date(fdDate);
        filterStart.setHours(0, 0, 0, 0);
        filterEnd = new Date(tdDate);
        filterEnd.setHours(23, 59, 59, 999);
        filterLabel = formatDate(fdDate) + ' to ' + formatDate(tdDate);
      }
    }
  } else {
    filterLabel = 'All Time';
  }
  
  if (currentFilter === 'all') {
    filteredSales = allSales.slice();
  } else if (filterStart && filterEnd) {
    filteredSales = allSales.filter(function(sale) {
      var saleDate = parseDate(sale.date);
      if (!saleDate) return false;
      saleDate.setHours(0, 0, 0, 0);
      return saleDate >= filterStart && saleDate <= filterEnd;
    });
  } else {
    filteredSales = allSales.slice();
  }
  
  renderSales(filteredSales, filterLabel);
}

function loadSales() {
  fetch(API_URL + "?action=getAll&key=" + SECRET_KEY)
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (data.success) {
        allSales = data.sales;
        applyFilter();
      } else {
        document.getElementById('salesList').innerHTML = '<div class="empty">Error loading sales</div>';
      }
    })
    .catch(function(error) {
      document.getElementById('salesList').innerHTML = '<div class="empty">Failed to connect</div>';
      console.log(error);
    });
}

function renderSales(sales, filterLabel) {
  var container = document.getElementById('salesList');
  
  if (!sales || sales.length === 0) {
    container.innerHTML = '<div class="empty">No entries found for this filter.</div>';
    return;
  }
  
  var totalReceived = 0;
  var totalExpense = 0;
  var totalSavings = 0;
  sales.forEach(function(sale) {
    totalReceived += parseFloat(sale.received) || 0;
    totalExpense += parseFloat(sale.expense) || 0;
    totalSavings += parseFloat(sale.savings) || 0;
  });
  
  var html = '<div style="background:linear-gradient(145deg, #151515, #0d0d0d); border:1px solid #4ade80; border-radius:16px; padding:20px; margin-bottom:20px;">';
  html += '<h3 style="color:#4ade80; font-size:15px; margin-bottom:15px; font-weight:700;">📊 TOTAL SUMMARY — ' + (filterLabel || '') + '</h3>';
  html += '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px;">';
  html += '<div style="background:#111; border:1px solid #333; border-radius:12px; padding:12px; text-align:center;"><p style="color:#888; font-size:11px; margin-bottom:4px;">TOTAL RECEIVED</p><p style="color:#4ade80; font-size:20px; font-weight:800;">₹' + totalReceived + '</p></div>';
  html += '<div style="background:#111; border:1px solid #333; border-radius:12px; padding:12px; text-align:center;"><p style="color:#888; font-size:11px; margin-bottom:4px;">TOTAL EXPENSE</p><p style="color:#ff6666; font-size:20px; font-weight:800;">₹' + totalExpense + '</p></div>';
  html += '<div style="background:#111; border:1px solid #333; border-radius:12px; padding:12px; text-align:center;"><p style="color:#888; font-size:11px; margin-bottom:4px;">TOTAL SAVINGS</p><p style="color:#ffb800; font-size:20px; font-weight:800;">₹' + totalSavings + '</p></div>';
  html += '</div></div>';
  
  html += '<div class="sale-grid">';
  sales.forEach(function(sale) {
    html += '<div class="sale-card">';
    html += '<span class="date-badge">📅 ' + (sale.date || '-') + '</span>';
    html += '<h4>' + (sale.work || 'Untitled') + '</h4>';
    if (sale.customerName) {
      html += '<div class="sale-row"><span class="lbl">Customer</span><span class="val">' + sale.customerName + '</span></div>';
    }
    html += '<div class="sale-row"><span class="lbl">Received</span><span class="val val-green">₹' + (sale.received || 0) + '</span></div>';
    html += '<div class="sale-row"><span class="lbl">Expense</span><span class="val val-red">₹' + (sale.expense || 0) + '</span></div>';
    html += '<div class="sale-row"><span class="lbl">Savings</span><span class="val val-gold">₹' + (sale.savings || 0) + '</span></div>';
    if (sale.paymentMode) {
      html += '<div class="sale-row"><span class="lbl">Payment</span><span class="val">' + sale.paymentMode + '</span></div>';
    }
    if (sale.notes) {
      html += '<div class="sale-row"><span class="lbl">Notes</span><span class="val">' + sale.notes + '</span></div>';
    }
    html += '<div class="sale-row"><span class="lbl">Entry By</span><span class="val">' + (sale.entryBy || '-') + '</span></div>';
    
    if (isAdmin) {
      html += '<div class="card-actions">';
      html += '<button class="btn btn-small btn-edit" onclick="editItem(' + sale.row + ')">✏️ Edit</button>';
      html += '<button class="btn btn-small btn-delete" onclick="deleteItem(' + sale.row + ')">🗑️ Delete</button>';
      html += '</div>';
    }
    
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function filterSales() {
  var query = document.getElementById('searchInput').value.toLowerCase();
  if (!query) { renderSales(filteredSales); return; }
  var result = filteredSales.filter(function(item) {
    return (item.customerName || '').toLowerCase().indexOf(query) !== -1 ||
           (item.work || '').toLowerCase().indexOf(query) !== -1 ||
           (item.notes || '').toLowerCase().indexOf(query) !== -1;
  });
  renderSales(result);
}

function exportCSV() {
  if (!filteredSales || filteredSales.length === 0) {
    toast('No data to export', true);
    return;
  }
  
  var csv = 'Date,Customer,Work,Received,Expense,Savings,Payment,Notes,Entry By\n';
  filteredSales.forEach(function(s) {
    csv += '"' + (s.date || '') + '","' + (s.customerName || '') + '","' + (s.work || '') + '","' + (s.received || 0) + '","' + (s.expense || 0) + '","' + (s.savings || 0) + '","' + (s.paymentMode || '') + '","' + (s.notes || '') + '","' + (s.entryBy || '') + '"\n';
  });
  
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var link = document.createElement('a');
  var url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', 'sale_register_' + new Date().toISOString().split('T')[0] + '.csv');
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  toast('CSV exported!');
}

function submitForm() {
  var work = document.getElementById('work').value.trim();
  var received = document.getElementById('received').value.trim();
  var expense = document.getElementById('expense').value.trim();
  var entryBy = document.getElementById('entryBy').value.trim();
  
  if (!work || !received || !expense || !entryBy) {
    toast('Please fill all required fields (*)', true);
    return;
  }
  
  var params = new URLSearchParams({
    key: SECRET_KEY,
    date: document.getElementById('dateInput').value,
    customerName: document.getElementById('customerName').value.trim(),
    work: work,
    received: received,
    expense: expense,
    paymentMode: document.getElementById('paymentMode').value,
    notes: document.getElementById('notes').value.trim(),
    entryBy: entryBy
  });
  
  if (editingRow && isAdmin) {
    params.append('row', editingRow);
    params.append('action', 'update');
  } else {
    params.append('action', 'add');
  }
  
  var url = API_URL + '?' + params.toString();
  
  document.getElementById('submitBtn').textContent = 'Saving...';
  fetch(url)
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (data.success) {
        toast(editingRow ? 'Entry updated!' : 'Entry added!');
        resetForm();
        loadSales();
      } else {
        toast('Error: ' + (data.error || 'Unknown'), true);
      }
    })
    .catch(function(error) {
      toast('Connection error', true);
    })
    .finally(function() {
      document.getElementById('submitBtn').textContent = editingRow ? 'Update Entry' : 'Add Entry';
    });
}

function editItem(row) {
  if (!isAdmin) {
    toast('Only admin can edit entries', true);
    return;
  }
  var item = allSales.find(function(s) { return s.row === row; });
  if (!item) return;
  document.getElementById('customerName').value = item.customerName || '';
  document.getElementById('work').value = item.work || '';
  document.getElementById('received').value = item.received || '';
  document.getElementById('expense').value = item.expense || '';
  document.getElementById('paymentMode').value = item.paymentMode || '';
  document.getElementById('notes').value = item.notes || '';
  document.getElementById('entryBy').value = item.entryBy || '';
  
  editingRow = row;
  document.getElementById('formTitle').textContent = '✏️ Edit Entry (Row ' + row + ')';
  document.getElementById('submitBtn').textContent = 'Update Entry';
  document.getElementById('cancelBtn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  resetForm();
}

function resetForm() {
  ['customerName','work','received','expense','paymentMode','notes','entryBy'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  editingRow = null;
  document.getElementById('formTitle').textContent = '➕ Add New Entry';
  document.getElementById('submitBtn').textContent = 'Add Entry';
  document.getElementById('cancelBtn').style.display = 'none';
  setTodayDate();
}

function deleteItem(row) {
  if (!isAdmin) {
    toast('Only admin can delete entries', true);
    return;
  }
  if (!confirm('Are you sure you want to delete this entry?')) return;
  fetch(API_URL + "?action=delete&key=" + SECRET_KEY + "&row=" + row)
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (data.success) {
        toast('Entry deleted!');
        loadSales();
      } else {
        toast('Error deleting', true);
      }
    })
    .catch(function(error) {
      toast('Connection error', true);
    });
}

window.addEventListener('DOMContentLoaded', function() {
  setTodayDate();
  updateUI();
  setFilter('today');
  loadSales();
});
</script>
</body>
</html>

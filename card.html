.info-text { font-size: 13px; color: #ccc; line-height: 1.4; word-break: break-word; }
.info-text a { color: #ccc; text-decoration: none; }
.info-text a:hover { color: #fff; }
.info-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 2px; }

.action-buttons { display: flex; gap: 10px; margin: 25px 0; position: relative; z-index: 1; }

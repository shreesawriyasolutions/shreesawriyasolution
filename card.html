.info-text { font-size: .92rem; color: var(--ink); line-height: 1.4; word-break: break-word; }
.info-text a { color: var(--ink); text-decoration: none; font-weight: 500; }
.info-text a:hover { color: var(--green); }
.info-label { font-size: .68rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: .1em; display: block; margin-bottom: 2px; }

.action-buttons { display: flex; gap: 10px; margin: 25px 0; position: relative; z-index: 1; }
.action-btn { flex: 1; min-height: 50px; padding: 0 14px; border-radius: 99px; font: 600 1rem var(--body); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .25s cubic-bezier(.3,1.6,.5,1); }

.action-btn:active { transform: scale(.96); }

.qr-section { padding-top: 20px; border-top: 1px solid var(--line); position: relative; z-index: 1; }
.qr-label { font-size: .72rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
.qr-img { width: 140px; height: 140px; background: #fff; padding: 10px; border-radius: 16px; margin: 0 auto; }

.share-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; min-height: 46px; padding: 0 24px; border-radius: 99px; background: var(--glass-strong); border: 1px solid var(--edge); color: var(--ink); font: 600 .92rem var(--body); cursor: pointer; text-decoration: none; position: relative; z-index: 1; }
.share-btn:hover { background: var(--glass); }

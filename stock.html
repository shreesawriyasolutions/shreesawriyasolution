<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Stock Management | Shree Sawriya Solutions</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hind:wght@400;500;600&family=Noto+Sans+Gurmukhi:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sale.css">
  <link rel="stylesheet" href="stock.css">
</head>
<body>

  <!-- ============ LOGIN SCREEN ============ -->
  <section id="loginView" class="login-wrap hidden">
    <div class="card login-card">
      <img src="logo.png" alt="Shree Sawriya Solutions" class="logo" onerror="this.style.display='none'">
      <h1>SHREE SAWRIYA SOLUTIONS</h1>
      <p class="muted">Stock Management</p>

      <div class="role-tabs">
        <button type="button" id="tabStaff" class="role-tab active">Staff Login</button>
        <button type="button" id="tabAdmin" class="role-tab">Admin Login</button>
      </div>

      <form id="loginForm" autocomplete="on">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" inputmode="email" autocomplete="username" required>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
        <button type="submit" id="loginBtn" class="btn btn-green btn-block">Login</button>
      </form>
      <a class="home-link" href="index.html">&larr; Home</a>
    </div>
  </section>

  <!-- ============ MAIN APP ============ -->
  <section id="appView" class="hidden">
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="" class="logo-small" onerror="this.style.display='none'">
        <div>
          <div class="brand-title">STOCK MANAGEMENT</div>
          <div class="brand-sub">Shree Sawriya Solutions &bull; <span id="whoText"></span></div>
        </div>
      </div>
      <div class="top-actions">
        <span id="modeBadge" class="badge"></span>
        <button type="button" id="logoutBtn" class="btn btn-ghost">Logout</button>
      </div>
    </header>

    <main class="container">

      <!-- Totals (tap karke filter) -->
      <div class="totals stock-totals">
        <button type="button" class="total-card t-btn" data-stat="all"><div class="t-label">Items</div><div class="t-value" id="totItems">0</div></button>
        <button type="button" class="total-card t-btn" data-stat="all"><div class="t-label">Total Pieces</div><div class="t-value" id="totPcs">0</div></button>
        <button type="button" class="total-card t-btn" data-stat="low"><div class="t-label">Kam Stock</div><div class="t-value amber" id="totLow">0</div></button>
        <button type="button" class="total-card t-btn" data-stat="out"><div class="t-label">Khatam</div><div class="t-value red" id="totOut">0</div></button>
      </div>

      <!-- Add New Stock -->
      <details class="card add-card" id="addCard">
        <summary><h2>+ Naya Stock Add Karo</h2></summary>
        <form id="addForm" novalidate>
          <div class="grid2">
            <div>
              <label for="fProduct">Product Name *</label>
              <input id="fProduct" type="text" list="dlProducts" autocomplete="off" required placeholder="Charging Flex, Ringer...">
            </div>
            <div>
              <label for="fCategory">Category *</label>
              <select id="fCategory">
                <option>Spare Part</option>
                <option>Accessory</option>
                <option>Mobile</option>
                <option>Other</option>
              </select>
            </div>
            <div>
              <label for="fBrand">Brand</label>
              <input id="fBrand" type="text" list="dlBrands" autocomplete="off" placeholder="Apple, Samsung...">
            </div>
            <div>
              <label for="fModel">Model</label>
              <input id="fModel" type="text" autocomplete="off" placeholder="iPhone 12, A52...">
            </div>
            <div>
              <label for="fQty">Quantity *</label>
              <input id="fQty" type="number" inputmode="numeric" min="0" step="1" required>
            </div>
            <div>
              <label for="fSupplier">Supplier</label>
              <input id="fSupplier" type="text" list="dlSuppliers" autocomplete="off">
            </div>
            <div>
              <label for="fBuy">Purchase Price (₹ per piece)</label>
              <input id="fBuy" type="number" inputmode="decimal" min="0" step="0.01">
            </div>
            <div>
              <label for="fSell">Selling Price (₹)</label>
              <input id="fSell" type="number" inputmode="decimal" min="0" step="0.01">
            </div>
            <div>
              <label for="fDate">Entry Date</label>
              <input id="fDate" type="date">
            </div>
          </div>
          <label for="fNotes">Notes (optional)</label>
          <textarea id="fNotes" rows="2" placeholder="Colour, quality, etc."></textarea>
          <p class="muted small" id="matchHint"></p>
          <button type="submit" id="addBtn" class="btn btn-green btn-block">Add Stock</button>
        </form>
      </details>

      <!-- Search + filters -->
      <div class="card">
        <label for="searchBox">Search</label>
        <input id="searchBox" type="search" placeholder="Part, brand, model, supplier ya notes" autocomplete="off">
        <div class="filters stock-filters" id="catFilters">
          <button type="button" class="filter-btn active" data-cat="">Sab</button>
          <button type="button" class="filter-btn" data-cat="Spare Part">Spare Part</button>
          <button type="button" class="filter-btn" data-cat="Accessory">Accessory</button>
          <button type="button" class="filter-btn" data-cat="Mobile">Mobile</button>
          <button type="button" class="filter-btn" data-cat="Other">Other</button>
        </div>
        <div class="period-label" id="countLabel"></div>
        <button type="button" id="exportBtn" class="btn btn-blue btn-block hidden">Download CSV</button>
      </div>

      <div id="stockList"><div class="empty">Stock load ho raha hai...</div></div>
    </main>
  </section>

  <datalist id="dlProducts"></datalist>
  <datalist id="dlBrands"></datalist>
  <datalist id="dlSuppliers"></datalist>

  <!-- ============ QTY POPUP (sab staff) ============ -->
  <div id="qtyModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="qtyTitle">Stock badlo</h2>
      <p class="muted" id="qtyItem"></p>
      <form id="qtyForm" novalidate>
        <div class="grid2">
          <div>
            <label for="qNum">Kitne piece *</label>
            <input id="qNum" type="number" inputmode="numeric" min="1" step="1" value="1" required>
          </div>
          <div>
            <label for="qReason">Kyun *</label>
            <select id="qReason"></select>
          </div>
        </div>
        <label for="qNote">Note (optional)</label>
        <input id="qNote" type="text" autocomplete="off" placeholder="Customer ka naam, repair ID...">
        <div class="grid2">
          <button type="submit" id="qSave" class="btn btn-green btn-block">Save</button>
          <button type="button" id="qCancel" class="btn btn-ghost btn-block">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ HISTORY POPUP ============ -->
  <div id="histModal" class="modal hidden">
    <div class="modal-box">
      <h2>Stock History</h2>
      <p class="muted" id="histItem"></p>
      <div id="histList"></div>
      <button type="button" id="histClose" class="btn btn-ghost btn-block">Close</button>
    </div>
  </div>

  <!-- ============ EDIT POPUP (Admin only) ============ -->
  <div id="editModal" class="modal hidden">
    <div class="modal-box">
      <h2>Edit Stock</h2>
      <form id="editForm" novalidate>
        <input type="hidden" id="eId">
        <div class="grid2">
          <div><label for="eProduct">Product Name *</label><input id="eProduct" type="text" list="dlProducts" required></div>
          <div>
            <label for="eCategory">Category *</label>
            <select id="eCategory"><option>Spare Part</option><option>Accessory</option><option>Mobile</option><option>Other</option></select>
          </div>
          <div><label for="eBrand">Brand</label><input id="eBrand" type="text" list="dlBrands"></div>
          <div><label for="eModel">Model</label><input id="eModel" type="text"></div>
          <div><label for="eQty">Quantity *</label><input id="eQty" type="number" inputmode="numeric" min="0" step="1" required></div>
          <div><label for="eMin">Kam stock alert (is se kam/barabar)</label><input id="eMin" type="number" inputmode="numeric" min="0" step="1"></div>
          <div><label for="eBuy">Purchase Price (₹)</label><input id="eBuy" type="number" inputmode="decimal" min="0" step="0.01"></div>
          <div><label for="eSell">Selling Price (₹)</label><input id="eSell" type="number" inputmode="decimal" min="0" step="0.01"></div>
          <div><label for="eSupplier">Supplier</label><input id="eSupplier" type="text" list="dlSuppliers"></div>
          <div><label for="eDate">Entry Date</label><input id="eDate" type="date"></div>
        </div>
        <label for="eNotes">Notes</label>
        <textarea id="eNotes" rows="2"></textarea>
        <div class="grid2">
          <button type="submit" class="btn btn-green btn-block">Save Changes</button>
          <button type="button" id="editCancel" class="btn btn-ghost btn-block">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="stock.js"></script>
</body>
</html>

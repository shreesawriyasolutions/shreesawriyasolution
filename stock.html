<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Management | Shree Sawriya Solutions</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
a { text-decoration: none; color: inherit; }

.navbar { position: sticky; top: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #222; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-wrap: wrap; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; color: #fff; }
.logo img { width: 34px; height: 34px; object-fit: contain; }
.back-btn { color: #aaa; font-size: 13px; }
.admin-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 14px; border-radius: 50px; font-size: 12px; font-weight: 600; cursor: pointer; }
.admin-btn.active { background: linear-gradient(90deg, #4ade80, #22c55e); color: #000; border: none; }

.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

.page-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; text-align: center; }
.page-sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }

.mode-badge { text-align: center; margin-bottom: 20px; }
.mode-badge span { display: inline-block; padding: 6px 16px; border-radius: 50px; font-size: 12px; font-weight: 700; }
.mode-team { background: rgba(255,184,0,0.15); color: #ffb800; }
.mode-admin { background: rgba(74,222,128,0.15); color: #4ade80; }

.form-box { background: linear-gradient(145deg, #151515, #0d0d0d); border: 1px solid #2a2a2a; border-radius: 20px; padding: 25px; margin-bottom: 25px; }
.form-box h3 { color: #fff; font-size: 18px; margin-bottom: 20px; font-weight: 700; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
@media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
.form-grid input, .form-grid select, .form-grid textarea {
  padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 13px; outline: none; font-family: inherit;
}
.form-grid textarea { grid-column: 1 / -1; min-height: 60px; resize: vertical; }
.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus { border-color: #4ade80; }

.btn { padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; font-family: inherit; }
.btn-primary { background: linear-gradient(90deg, #4ade80, #22c55e); color: #000; }
.btn-cancel { background: #333; color: #fff; margin-left: 10px; }
.btn-small { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

.search-box { display: flex; gap: 10px; margin-bottom: 20px; }
.search-box input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 14px; outline: none; }

.stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
.stock-card { background: linear-gradient(145deg, #151515, #0d0d0d); border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; position: relative; }
.stock-card h4 { color: #fff; font-size: 16px; margin-bottom: 6px; font-weight: 700; }
.stock-card .cat { display: inline-block; background: #111; border: 1px solid #333; padding: 3px 10px; border-radius: 50px; font-size: 11px; color: #aaa; margin-bottom: 12px; }
.stock-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid #1a1a1a; }
.stock-row:last-child { border-bottom: none; }
.stock-row .lbl { color: #888; }
.stock-row .val { color: #fff; font-weight: 600; }
.qty-badge { display: inline-block; padding: 3px 10px; border-radius: 50px; font-size: 11px; font-weight: 700; }
.qty-ok { background: rgba(74,222,128,0.2); color: #4ade80; }
.qty-low { background: rgba(255,184,0,0.2); color: #ffb800; }
.qty-out { background: rgba(255,68,68,0.2); color: #ff4444; }
.card-actions { display: flex; gap: 8px; margin-top: 15px; }
.btn-edit { background: #1a1a1a; color: #fff; border: 1px solid #333; }
.btn-delete { background: #2a1a1a; color: #ff6666; border: 1px solid #553333; }

.loading { text-align: center; padding: 40px; color: #888; }
.empty { text-align: center; padding: 40px; color: #666; }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #000; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 9999; }
#toast.show { opacity: 1; }
#toast.error { background: #ff4444; color: #fff; }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">
    <img src="logo.png" alt="Shree Sawriya">
    <span>STOCK MANAGEMENT</span>
  </a>
  <button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">⚙️ Admin Login</button>
  <a href="index.html" class="back-btn">← Home</a>
</nav>

<div class="container">
  <h1 class="page-title">Stock Management</h1>
  <p class="page-sub">Add, edit, or delete stock items</p>

  <div class="mode-badge">
    <span id="modeBadge" class="mode-team">👥 TEAM MODE — Add Only</span>
  </div>

  <div class="form-box">
    <h3 id="formTitle">➕ Add New Stock</h3>
    <div class="form-grid">
      <input type="text" id="productName" placeholder="Product Name *" required>
      <select id="category">
        <option value="">Select Category</option>
        <option value="Mobile">Mobile</option>
        <option value="Spare Part">Spare Part</option>
        <option value="Accessory">Accessory</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="brand" placeholder="Brand (Apple, Samsung, etc.)">
      <input type="text" id="model" placeholder="Model (iPhone 12, etc.)">
      <input type="number" id="quantity" placeholder="Quantity *" required>
      <input type="number" id="purchasePrice" placeholder="Purchase Price (₹)">
      <input type="number" id="sellingPrice" placeholder="Selling Price (₹)">
      <input type="text" id="supplier" placeholder="Supplier Name">
      <input type="text" id="updatedBy" placeholder="Your Name *" required>
      <input type="date" id="entryDate">
      <textarea id="notes" placeholder="Notes (optional)"></textarea>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">Add Stock</button>
    <button class="btn btn-cancel" id="cancelBtn" onclick="cancelEdit()" style="display:none;">Cancel</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by product name..." oninput="filterStock()">
  </div>

  <div id="stockList">
    <div class="loading">Loading stock...</div>
  </div>
</div>

<div id="toast"></div>

<script>
// ========== 2-PASSWORD LOGIN SYSTEM ==========
var TEAM_PASSWORD = "Sahil@9896#";
var ADMIN_PASSWORD = "Renu@9896#";
var MAX_ATTEMPTS = 5;
var isAdmin = false;

(function() {
  var mode = sessionStorage.getItem('stock_mode');
  
  if (mode === 'admin') {
    isAdmin = true;
  } else if (mode === 'team') {
    isAdmin = false;
  } else {
    var attempts = 0;
    var enteredPassword = prompt("🔐 Stock Management\n\nPlease enter your password:");
    
    while (enteredPassword !== TEAM_PASSWORD && enteredPassword !== ADMIN_PASSWORD && attempts < MAX_ATTEMPTS) {
      attempts++;
      if (attempts >= MAX_ATTEMPTS) {
        document.body.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#0a0a0a; color:#fff; font-family:sans-serif; text-align:center; padding:20px;"><div><h2 style="color:#ff4444;">🔒 Access Locked</h2><p style="color:#888; margin-top:10px;">Too many wrong attempts. Refresh the page to try again.</p></div></div>';
        return;
      }
      enteredPassword = prompt("❌ Wrong password! Attempts left: " + (MAX_ATTEMPTS - attempts) + "\n\nPlease try again:");
    }
    
    if (enteredPassword === ADMIN_PASSWORD) {
      isAdmin = true;
      sessionStorage.setItem('stock_mode', 'admin');
    } else if (enteredPassword === TEAM_PASSWORD) {
      isAdmin = false;
      sessionStorage.setItem('stock_mode', 'team');
    } else {
      document.body.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100vh; background:#0a0a0a; color:#fff; font-family:sans-serif;"><h2 style="color:#ff4444;">🔒 Access Denied</h2></div>';
      return;
    }
  }
})();

function toggleAdmin() {
  if (isAdmin) {
    if (confirm("Logout from Admin Mode?")) {
      sessionStorage.removeItem('stock_mode');
      location.reload();
    }
  } else {
    var pass = prompt("🔐 Admin Login\n\nEnter Admin Password:");
    if (pass === ADMIN_PASSWORD) {
      isAdmin = true;
      sessionStorage.setItem('stock_mode', 'admin');
      location.reload();
    } else {
      alert("❌ Wrong admin password!");
    }
  }
}

// ========== STOCK MANAGEMENT ==========
var API_URL = "https://script.google.com/macros/s/AKfycbzq5i57tFsW1djo4-6XdZ3yIQo8MvSycDh8hV2gKNemtHO8Tv3wCwRBHh2bWfzTdPROtQ/exec";
var SECRET_KEY = "sawriya_stock_2025_secure";

var allStock = [];
var editingRow = null;

function toast(msg, isError) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isError ? 'show error' : 'show';
  setTimeout(function() { el.className = ''; }, 3000);
}

function updateUI() {
  var adminBtn = document.getElementById('adminBtn');
  var modeBadge = document.getElementById('modeBadge');
  
  if (isAdmin) {
    adminBtn.textContent = '🚪 Logout Admin';
    adminBtn.classList.add('active');
    modeBadge.textContent = '👑 ADMIN MODE — Full Access';
    modeBadge.className = 'mode-admin';
  } else {
    adminBtn.textContent = '⚙️ Admin Login';
    adminBtn.classList.remove('active');
    modeBadge.textContent = '👥 TEAM MODE — Add Only';
    modeBadge.className = 'mode-team';
  }
}

function loadStock() {
  fetch(API_URL + "?action=getAll&key=" + SECRET_KEY)
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (data.success) {
        allStock = data.stock;
        renderStock(allStock);
      } else {
        document.getElementById('stockList').innerHTML = '<div class="empty">Error loading stock</div>';
      }
    })
    .catch(function(error) {
      document.getElementById('stockList').innerHTML = '<div class="empty">Failed to connect</div>';
      console.log(error);
    });
}

function renderStock(stock) {
  var container = document.getElementById('stockList');
  if (!stock || stock.length === 0) {
    container.innerHTML = '<div class="empty">No stock items yet. Add your first item above.</div>';
    return;
  }
  var html = '<div class="stock-grid">';
  stock.forEach(function(item) {
    var qty = parseInt(item.quantity) || 0;
    var qtyClass = qty > 10 ? 'qty-ok' : (qty > 0 ? 'qty-low' : 'qty-out');
    var qtyText = qty > 0 ? qty + ' in stock' : 'Out of stock';
    html += '<div class="stock-card">';
    html += '<h4>' + (item.productName || 'Untitled') + '</h4>';
    html += '<span class="cat">' + (item.category || 'Uncategorized') + '</span>';
    html += '<div class="stock-row"><span class="lbl">Brand</span><span class="val">' + (item.brand || '-') + '</span></div>';
    html += '<div class="stock-row"><span class="lbl">Model</span><span class="val">' + (item.model || '-') + '</span></div>';
    html += '<div class="stock-row"><span class="lbl">Quantity</span><span class="qty-badge ' + qtyClass + '">' + qtyText + '</span></div>';
    html += '<div class="stock-row"><span class="lbl">Purchase</span><span class="val">₹' + (item.purchasePrice || 0) + '</span></div>';
    html += '<div class="stock-row"><span class="lbl">Selling</span><span class="val">₹' + (item.sellingPrice || 0) + '</span></div>';
    html += '<div class="stock-row"><span class="lbl">Supplier</span><span class="val">' + (item.supplier || '-') + '</span></div>';
    html += '<div class="stock-row"><span class="lbl">Updated</span><span class="val">' + (item.lastUpdatedBy || '-') + '</span></div>';
    
    if (isAdmin) {
      html += '<div class="card-actions">';
      html += '<button class="btn btn-small btn-edit" onclick="editItem(' + item.row + ')">✏️ Edit</button>';
      html += '<button class="btn btn-small btn-delete" onclick="deleteItem(' + item.row + ')">🗑️ Delete</button>';
      html += '</div>';
    }
    
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function filterStock() {
  var query = document.getElementById('searchInput').value.toLowerCase();
  if (!query) { renderStock(allStock); return; }
  var filtered = allStock.filter(function(item) {
    return (item.productName || '').toLowerCase().indexOf(query) !== -1 ||
           (item.brand || '').toLowerCase().indexOf(query) !== -1 ||
           (item.model || '').toLowerCase().indexOf(query) !== -1;
  });
  renderStock(filtered);
}

function submitForm() {
  var productName = document.getElementById('productName').value.trim();
  var quantity = document.getElementById('quantity').value.trim();
  var updatedBy = document.getElementById('updatedBy').value.trim();
  
  if (!productName || !quantity || !updatedBy) {
    toast('Please fill all required fields (*)', true);
    return;
  }
  
  var params = new URLSearchParams({
    key: SECRET_KEY,
    productName: productName,
    category: document.getElementById('category').value,
    brand: document.getElementById('brand').value.trim(),
    model: document.getElementById('model').value.trim(),
    quantity: quantity,
    purchasePrice: document.getElementById('purchasePrice').value || 0,
    sellingPrice: document.getElementById('sellingPrice').value || 0,
    supplier: document.getElementById('supplier').value.trim(),
    entryDate: document.getElementById('entryDate').value || '',
    updatedBy: updatedBy,
    notes: document.getElementById('notes').value.trim()
  });
  
  if (editingRow && isAdmin) {
    params.append('row', editingRow);
    params.append('action', 'update');
  } else {
    params.append('action', 'add');
  }
  
  var url = API_URL + '?' + params.toString();
  
  document.getElementById('submitBtn').textContent = 'Saving...';
  fetch(url)
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (data.success) {
        toast(editingRow ? 'Stock updated!' : 'Stock added!');
        resetForm();
        loadStock();
      } else {
        toast('Error: ' + (data.error || 'Unknown'), true);
      }
    })
    .catch(function(error) {
      toast('Connection error', true);
    })
    .finally(function() {
      document.getElementById('submitBtn').textContent = editingRow ? 'Update Stock' : 'Add Stock';
    });
}

function editItem(row) {
  if (!isAdmin) {
    toast('Only admin can edit entries', true);
    return;
  }
  var item = allStock.find(function(s) { return s.row === row; });
  if (!item) return;
  document.getElementById('productName').value = item.productName || '';
  document.getElementById('category').value = item.category || '';
  document.getElementById('brand').value = item.brand || '';
  document.getElementById('model').value = item.model || '';
  document.getElementById('quantity').value = item.quantity || '';
  document.getElementById('purchasePrice').value = item.purchasePrice || '';
  document.getElementById('sellingPrice').value = item.sellingPrice || '';
  document.getElementById('supplier').value = item.supplier || '';
  document.getElementById('updatedBy').value = item.lastUpdatedBy || '';
  document.getElementById('entryDate').value = item.entryDate ? convertDate(item.entryDate) : '';
  document.getElementById('notes').value = item.notes || '';
  
  editingRow = row;
  document.getElementById('formTitle').textContent = '✏️ Edit Stock (Row ' + row + ')';
  document.getElementById('submitBtn').textContent = 'Update Stock';
  document.getElementById('cancelBtn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function convertDate(dateStr) {
  if (!dateStr) return '';
  if (typeof dateStr === 'string' && dateStr.indexOf('/') !== -1) {
    var parts = dateStr.split('/');
    if (parts.length === 3) return parts[2] + '-' + parts[1].padStart(2, '0') + '-' + parts[0].padStart(2, '0');
  }
  return '';
}

function cancelEdit() {
  resetForm();
}

function resetForm() {
  ['productName','brand','model','quantity','purchasePrice','sellingPrice','supplier','updatedBy','entryDate','notes'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('category').value = '';
  editingRow = null;
  document.getElementById('formTitle').textContent = '➕ Add New Stock';
  document.getElementById('submitBtn').textContent = 'Add Stock';
  document.getElementById('cancelBtn').style.display = 'none';
}

function deleteItem(row) {
  if (!isAdmin) {
    toast('Only admin can delete entries', true);
    return;
  }
  if (!confirm('Are you sure you want to delete this item?')) return;
  fetch(API_URL + "?action=delete&key=" + SECRET_KEY + "&row=" + row)
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (data.success) {
        toast('Stock deleted!');
        loadStock();
      } else {
        toast('Error deleting', true);
      }
    })
    .catch(function(error) {
      toast('Connection error', true);
    });
}

window.addEventListener('DOMContentLoaded', function() {
  updateUI();
  loadStock();
});
</script>
</body>
</html>
